# ============================================================
# GitOracle — Infrastructure docker-compose
# Starts all data stores, message brokers, and observability
# services. Does NOT start application services.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml down -v   (nuke everything)
# ============================================================

name: git-oracle-infra

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  git-oracle-net:
    name: git-oracle-net
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  redis-data:
  qdrant-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  langfuse-data:

services:

  # ============================================================
  # PostgreSQL 16 + pgvector
  # Stores: agent jobs, audit log, prompt versions, agent memory,
  #         eval results, human feedback, repo procedures
  # Also hosts the Langfuse database
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: git-oracle-postgres
    restart: unless-stopped
    mem_limit: 300m
    mem_reservation: 150m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitOracle}
      POSTGRES_USER: ${POSTGRES_USER:-gitOracle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitOracle} -d ${POSTGRES_DB:-gitOracle}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    shm_size: 128mb
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c maintenance_work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=4MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=2MB
        -c log_min_duration_statement=1000
        -c log_checkpoints=on

  # ============================================================
  # Neo4j 5 — Causal Git Graph
  # Stores: commit nodes, file nodes, bug nodes, developer nodes,
  #         causal relationships (INTRODUCED, CAUSED, RESOLVES)
  # ============================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: git-oracle-neo4j
    restart: unless-stopped
    mem_limit: 600m
    mem_reservation: 300m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7475}:7474" # Browser UI
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7688}:7687" # Bolt protocol (drivers)
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:?NEO4J_AUTH is required}"
      # APOC and GDS are NOT installed, and nothing in this repository uses
      # them — grepped repo-wide for `apoc.` and `gds.`: zero call sites. Every
      # Cypher statement GitOracle runs is plain MATCH / CREATE CONSTRAINT
      # (RiskController, Neo4jGraphService, infrastructure/neo4j/init.cypher).
      #
      # What was here before:
      #
      #   NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      #   NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      #   NEO4J_dbms_security_procedures_allowlist:    "apoc.*,gds.*"
      #
      # `apoc.*` includes apoc.load.json / apoc.load.jsonParams / apoc.load.csv,
      # which fetch a URL the CALLER supplies. That is a server-side request
      # forgery primitive reachable through Cypher — it would let a query pull
      # from 169.254.169.254, from any RFC1918 address, or from file:// — and
      # `unrestricted` additionally lifts the sandbox those procedures normally
      # run in. Granting it to run procedures nobody calls is pure surface.
      #
      # Removing the plugins rather than narrowing the allowlist is deliberate:
      # an allowlist that grants nothing depends on how a given Neo4j version
      # interprets an empty value, whereas an uninstalled procedure cannot be
      # called under any interpretation.
      #
      # To reintroduce them, install the specific plugin and allowlist the exact
      # procedures needed (e.g. "gds.graph.project,gds.pageRank.stream") — never
      # `apoc.*`, and never via `unrestricted`.
      NEO4J_dbms_security_procedures_unrestricted: ""
      NEO4J_dbms_security_procedures_allowlist: ""
      NEO4J_server_memory_heap_initial__size: "192m"
      NEO4J_server_memory_heap_max__size: "192m"
      NEO4J_server_memory_pagecache_size: "96m"
      NEO4J_db_transaction_timeout: "60s"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - ./infrastructure/neo4j:/neo4j-init:ro
    healthcheck:
      test: [ "CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging

  # Init container — runs init.cypher after Neo4j is healthy
  neo4j-init:
    image: neo4j:5.20-community
    container_name: git-oracle-neo4j-init
    mem_limit: 128m
    networks: [ git-oracle-net ]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Reads NEO4J_PASSWORD, not POSTGRES_PASSWORD. This interpolated
      # ${POSTGRES_PASSWORD} while its own error message named NEO4J_PASSWORD —
      # so the Neo4j schema init authenticated with the POSTGRES password. It
      # worked only because .env happens to set both to the same value; setting
      # a distinct NEO4J_PASSWORD would have made this container fail to
      # authenticate for a reason its error message actively pointed away from,
      # and it coupled two unrelated credentials.
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - ./infrastructure/neo4j:/neo4j-init:ro
    command: bash -c "echo '⏳ Running Neo4j schema init...' && cypher-shell -u neo4j -p $${NEO4J_PASSWORD} -a bolt://neo4j:7687 --file /neo4j-init/init.cypher && echo '✅ Neo4j schema initialised.'"
    restart: "no"

  # ============================================================
  # Redis 7 — Task Queue, Session Cache, Dedup Cache
  # Stores: test-requests queue, test-results pubsub,
  #         review sessions, prompt cache, error dedup keys
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: git-oracle-redis
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        --maxmemory 160mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --save 60 10000
        --loglevel notice
        --tcp-keepalive 300
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ============================================================
  # Qdrant — Vector Database for Agent Semantic Memory
  # Stores: cross-job repository knowledge (facts about codebases)
  # Purpose-built vector DB, faster than pgvector for large recall
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: git-oracle-qdrant
    restart: unless-stopped
    mem_limit: 200m
    mem_reservation: 100m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333" # REST API + Web UI
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      # Required — with this unset, Qdrant serves any request with no auth
      # at all. Every real client must send the same value back in an
      # api-key header (ai_core/shared/qdrant_client.py does this).
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ============================================================
  # Apache Kafka 3.7 (KRaft mode — no Zookeeper required)
  # Event backbone for all 16 GitOracle pipeline topics
  # ============================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: git-oracle-kafka
    restart: unless-stopped
    mem_limit: 450m
    mem_reservation: 250m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092" # External (host access)
    environment:
      # KRaft mode — no Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_HEAP_OPTS: "-Xmx200m -Xms200m"

      # Kafka's log cleaner allocates log.cleaner.dedupe.buffer.size as a SINGLE
      # contiguous HeapByteBuffer per cleaner thread during LogManager startup.
      # The default is 128MB, which cannot fit in the 200MB heap above alongside
      # the broker's own startup allocations — the result was
      # "OutOfMemoryError: Java heap space" inside LogCleaner.startup, which
      # ProcessTerminatingFaultHandler turns into an immediate exit, giving an
      # endless restart loop (observed: 97 restarts, RestartCount=97,
      # OOMKilled=false — i.e. the JVM heap, not the container mem_limit).
      #
      # 16MB is ample for this workload's only compacted topic
      # (__consumer_offsets) and keeps the deliberate memory budget intact —
      # see CLAUDE.md on why these caps are load-bearing rather than incidental.
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
      KAFKA_LOG_CLEANER_THREADS: 1

      # Without this the broker writes to the image's default /tmp/kafka-logs —
      # INSIDE the container, not the volume mounted below. Confirmed from the
      # broker's own startup line ("Loading logs from log dirs
      # ArrayBuffer(/tmp/kafka-logs)") and by the named volume being empty.
      # Every restart therefore discarded all topics, messages, and consumer
      # offsets, which reads as "Kafka keeps losing our topics" rather than as
      # a missing config line.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Listeners
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Performance & reliability
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    logging: *default-logging

  # Init container — creates all 16 Kafka topics after broker is healthy
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: git-oracle-kafka-init
    mem_limit: 128m
    networks: [ git-oracle-net ]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: [ "/bin/bash", "/create-topics.sh" ]
    restart: on-failure

  # Kafka Web UI — browse topics, messages, consumer groups
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: git-oracle-kafka-ui
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 150m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      JAVA_OPTS: "-Xmx160m"
      KAFKA_CLUSTERS_0_NAME: git-oracle
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      SERVER_SERVLET_CONTEXT_PATH: /
      AUTH_TYPE: "disabled"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging

  # ============================================================
  # Prometheus — Metrics Collection
  # Scrapes all Spring Boot services and Python agents
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: git-oracle-prometheus
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-admin-api
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  # ============================================================
  # Grafana — Observability Dashboard
  # Pre-loaded with GitOracle pipeline dashboard
  # Access: http://localhost:3001  admin / ${GRAFANA_ADMIN_PASSWORD}
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.4
    container_name: git-oracle-grafana
    restart: unless-stopped
    mem_limit: 220m
    mem_reservation: 100m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      # Datasource env vars (for PostgreSQL datasource)
      GF_DATASOURCE_PG_USER: ${POSTGRES_USER:-gitOracle}
      GF_DATASOURCE_PG_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ============================================================
  # Langfuse — LLM Observability (Self-Hosted)
  # Captures: every prompt, response, token count, latency
  # per LLM call. Trace hierarchy: job → agent_step → llm_call
  # Access: http://localhost:3002
  # ============================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: git-oracle-langfuse
    # Was "no" — meaning if this container ever stopped (e.g. during a host
    # crash/restart unrelated to Langfuse itself), it silently stayed down
    # forever instead of coming back with the rest of the infra stack.
    # Confirmed live: exited hours earlier, every other service recovered,
    # this one didn't, and every LLM call kept logging a swallowed connection
    # error the whole time. Match the restart policy every other service uses.
    restart: unless-stopped
    mem_limit: 500m
    mem_reservation: 250m
    networks: [ git-oracle-net ]
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitOracle}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3002}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      # Headless init: auto-provisions an org/project/user on first boot using
      # the exact LANGFUSE_PUBLIC_KEY/SECRET_KEY ai_core already reads from
      # .env, instead of requiring a manual signup + project-creation click-
      # through in the UI before those keys mean anything. Confirmed live this
      # was the root cause of "No key found for public key" / "Invalid
      # credentials" on every LLM call: the keys in .env were well-formed but
      # never registered anywhere, because no project had ever been created.
      LANGFUSE_INIT_ORG_ID: gitoracle-org
      LANGFUSE_INIT_ORG_NAME: GitOracle
      LANGFUSE_INIT_PROJECT_ID: gitoracle-project
      LANGFUSE_INIT_PROJECT_NAME: GitOracle
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY is required}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY is required}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@gitoracle.local}
      LANGFUSE_INIT_USER_NAME: GitOracle Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_NEXTAUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3000' 2>/dev/null || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging
