# HTTPS from the internet without a public IP or an open port: a Cloudflare
# Tunnel connects out to Cloudflare. In the Cloudflare dashboard, give the
# tunnel one public hostname (GITORACLE_PUBLIC_HOST) pointing at
# http://traefik.kube-system.svc.cluster.local:80, k3s' ingress controller.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cloudflared }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudflared }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.12.2
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - { name: TUNNEL_TOKEN, valueFrom: { secretKeyRef: { name: cloudflared, key: CLOUDFLARE_TUNNEL_TOKEN } } }
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 15
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
