# The seven Python agents: one image (ai_core/Dockerfile), AGENT picks which.
# /health is open (no token) and answers 503 while an agent's Kafka consumer
# is down, so readiness follows the consumer. Each agent clones the repos it
# reads into its own /tmp (shared/checkout.py), swept after
# GITORACLE_WORKSPACE_MAX_AGE_HOURS.
---
apiVersion: v1
kind: Service
metadata:
  name: investigator
spec:
  selector: { app.kubernetes.io/name: investigator }
  ports: [{ name: http, port: 9001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: investigator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: investigator }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: investigator
          image: gitoracle-agents
          envFrom:
            - configMapRef: { name: gitoracle-config }
            - secretRef: { name: gitoracle-secrets }
          env:
            - { name: AGENT, value: investigator }
            - { name: PORT, value: "9001" }
          ports: [{ containerPort: 9001 }]
          startupProbe:
            httpGet: { path: /health, port: 9001 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: 9001 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9001 }
            periodSeconds: 30
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 2Gi } }
---
