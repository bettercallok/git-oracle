# The six Java services (images from java-backend/Dockerfile). Heaps match
# start_local.sh; the memory limits leave room for metaspace and threads.
# One replica each: the orchestrator could run more (ShedLock), the rest
# have never been tested that way.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api-gateway }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api-gateway
          image: gitoracle-api-gateway
          envFrom:
            - configMapRef: { name: gitoracle-config }
            - secretRef: { name: gitoracle-secrets }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx224m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Xss256k" }
          ports: [{ containerPort: 8080 }]
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 2Gi } }
---
