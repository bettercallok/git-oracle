  ports: [{ name: http, port: 8083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orchestrator
          image: gitoracle-orchestrator
          envFrom:
            - configMapRef: { name: gitoracle-config }
            - secretRef: { name: gitoracle-secrets }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx320m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Xss256k" }
          ports: [{ containerPort: 8083 }]
          startupProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8083 }
            periodSeconds: 30
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: github-app, mountPath: /secrets/github, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 2Gi } }
        - { name: github-app, secret: { secretName: gitoracle-github-app, defaultMode: 0440 } }
---
