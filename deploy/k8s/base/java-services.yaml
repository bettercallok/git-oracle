apiVersion: v1
kind: Service
metadata:
  name: test-runner
spec:
  selector: { app.kubernetes.io/name: test-runner }
  ports: [{ name: http, port: 8084 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-runner
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: test-runner }
  template:
    metadata:
      labels: { app.kubernetes.io/name: test-runner }
    spec:
      serviceAccountName: test-runner
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: test-runner
          image: gitoracle-test-runner
          envFrom:
            - configMapRef: { name: gitoracle-config }
            - secretRef: { name: gitoracle-secrets }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx224m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Xss256k" }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
          ports: [{ containerPort: 8084 }]
          startupProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8084 }
            periodSeconds: 30
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workspaces, mountPath: /tmp/gitoracle-workspaces }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 2Gi } }
        - { name: workspaces, persistentVolumeClaim: { claimName: gitoracle-test-workspaces } }
