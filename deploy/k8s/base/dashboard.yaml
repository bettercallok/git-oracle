# The dashboard: static files behind nginx (dashboard/Dockerfile), built with
# VITE_API_URL=/api/v1 so it calls the gateway on its own host (ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: { app.kubernetes.io/name: dashboard }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: dashboard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dashboard }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: gitoracle-dashboard
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
