version: 2
updates:
  # Keeps the workflows off deprecated action runtimes (the Node16-based
  # setup-python@v4 / setup-java@v3 sat here unnoticed).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    groups:
      dashboard:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /java-backend
    schedule:
      interval: monthly
    groups:
      java:
        patterns: ["*"]
    # Major versions (Spring Boot 3 → 4, Gradle 8 → 9, ...) are migrations, not
    # bumps: #18 bundled them with routine updates and didn't compile. Those are
    # done deliberately; Dependabot keeps sending minor and patch updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
