name: Golden Dataset Eval

# Drives the golden dataset through the real pipeline (infra + all 6 Java
# services + 7 Python agents + a real LLM) and fails if patch accuracy drops
# below the threshold. Too slow and too costly in LLM tokens for every push, so
# it runs nightly and on demand.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secrets.EVAL_LLM_BASE_URL    full chat-completions URL, e.g.
#                                https://api.groq.com/openai/v1/chat/completions
#   secrets.EVAL_LLM_API_KEY     key for that endpoint
#   secrets.EVAL_LLM_MODEL_NAME  model id served by that endpoint
#   secrets.GITORACLE_APP_ID     the GitOracle GitHub App's numeric App ID
#   secrets.GITORACLE_APP_PRIVATE_KEY
#                                the App's private key, exactly as GitHub gave
#                                it (PKCS#1 is fine — converted here for Java)
#   vars.EVAL_FIXTURE_REPO       owner/name of a PUBLIC repo that holds nothing
#                                but the generated golden repo, with the
#                                GitOracle App installed on it
#
# Why a GitHub fixture repo: /trigger only accepts https://github.com/... URLs
# (RepoRefValidator), so the old file:///tmp/gitoracle-eval-repo was rejected
# before anything ran.
#
# The App is used for everything GitHub-side: a short-lived installation token
# force-pushes the golden repo, and the same App credentials go to github-bot
# and the orchestrator, so the pipeline really opens its PR on the fixture repo
# and the eval exercises the full path through PR_OPENED. No personal token.

on:
  workflow_dispatch:
    inputs:
      min_score:
        description: 'Minimum patch accuracy (0.0-1.0) to pass'
        required: false
        default: '0.75'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    name: Golden Dataset Eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIN_SCORE: ${{ inputs.min_score || '0.75' }}
      # Per case. /trigger runs the full pipeline (investigate → plan → up to 3
      # fix attempts → Maven tests in Docker, cold cache on a fresh runner), which
      # can outrun the script's 10-minute default. 2 cases × 15 min + ~5 min
      # setup stays well inside the job's 60-minute timeout.
      EVAL_POLL_TIMEOUT: '900'
      EVAL_FIXTURE_REPO: ${{ vars.EVAL_FIXTURE_REPO }}
    steps:
      - name: Check configuration
        env:
          LLM_URL: ${{ secrets.EVAL_LLM_BASE_URL }}
          LLM_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.EVAL_LLM_MODEL_NAME }}
          APP_ID: ${{ secrets.GITORACLE_APP_ID }}
          APP_KEY: ${{ secrets.GITORACLE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$LLM_URL" ]           || missing="$missing secrets.EVAL_LLM_BASE_URL"
          [ -n "$LLM_KEY" ]           || missing="$missing secrets.EVAL_LLM_API_KEY"
          [ -n "$LLM_MODEL" ]         || missing="$missing secrets.EVAL_LLM_MODEL_NAME"
          [ -n "$APP_ID" ]            || missing="$missing secrets.GITORACLE_APP_ID"
          [ -n "$APP_KEY" ]           || missing="$missing secrets.GITORACLE_APP_PRIVATE_KEY"
          [ -n "$EVAL_FIXTURE_REPO" ] || missing="$missing vars.EVAL_FIXTURE_REPO"
          if [ -n "$missing" ]; then
            echo "::error::Eval is not configured. Missing:$missing (see the header of .github/workflows/eval.yml)"
            exit 1
          fi
          case "$EVAL_FIXTURE_REPO" in
            */*) ;;
            *) echo "::error::vars.EVAL_FIXTURE_REPO must be owner/name, got '$EVAL_FIXTURE_REPO'"; exit 1 ;;
          esac
          echo "FIXTURE_OWNER=${EVAL_FIXTURE_REPO%%/*}" >> "$GITHUB_ENV"
          echo "FIXTURE_NAME=${EVAL_FIXTURE_REPO#*/}" >> "$GITHUB_ENV"

      # Installation token scoped to the fixture repo only; revoked automatically
      # when the job ends. Fails here if the App isn't installed on that repo.
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITORACLE_APP_ID }}
          private-key: ${{ secrets.GITORACLE_APP_PRIVATE_KEY }}
          owner: ${{ env.FIXTURE_OWNER }}
          repositories: ${{ env.FIXTURE_NAME }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_core/requirements.txt

      # start_local.sh activates ai_core/.venv for the agents.
      - name: Install Python agent dependencies
        run: |
          python -m venv ai_core/.venv
          ai_core/.venv/bin/pip install --upgrade pip
          ai_core/.venv/bin/pip install -r ai_core/requirements.txt
          pip install -r ai_core/requirements.txt

      # Throwaway per-run credentials for everything internal; only the LLM
      # settings come from secrets. Later lines override .env.example's
      # placeholders when the file is sourced.
      - name: Write .env
        env:
          LLM_URL: ${{ secrets.EVAL_LLM_BASE_URL }}
          LLM_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.EVAL_LLM_MODEL_NAME }}
        run: |
          rnd() { openssl rand -hex 24; }
          API_KEY=$(rnd)
          echo "::add-mask::$API_KEY"
          cp .env.example .env
          {
            echo ""
            echo "# ── CI overrides ──"
            echo "GITORACLE_API_KEY=$API_KEY"
            echo "GITORACLE_LEGACY_API_KEY_ENABLED=true"
            echo "GITORACLE_INTERNAL_TOKEN=$(rnd)"
            echo "POSTGRES_PASSWORD=$(rnd)"
            echo "REDIS_PASSWORD=$(rnd)"
            echo "QDRANT_API_KEY=$(rnd)"
            echo "GRAFANA_ADMIN_PASSWORD=$(rnd)"
            echo "LANGFUSE_NEXTAUTH_SECRET=$(rnd)"
            echo "LANGFUSE_SALT=$(rnd)"
            # Langfuse isn't started here; empty keys turn tracing off instead of
            # failing (and blocking on a flush) on every LLM call.
            echo "LANGFUSE_PUBLIC_KEY="
            echo "LANGFUSE_SECRET_KEY="
            echo "JWT_SECRET=$(rnd)$(rnd)"
            echo "LLM_BASE_URL=$LLM_URL"
            echo "LLM_API_KEY=$LLM_KEY"
            echo "OPENAI_API_KEY=$LLM_KEY"
            echo "LLM_MODEL=$LLM_MODEL"
            echo "LLM_MODEL_NAME=$LLM_MODEL"
          } >> .env
          echo "GITORACLE_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      # github-bot and the orchestrator read App credentials from
      # java-backend/github-bot/.env (deliberately not the root .env — see
      # GitHubClient.java). The Java loader needs PKCS#8; GitHub issues PKCS#1.
      - name: Write GitHub App credentials
        env:
          APP_ID: ${{ secrets.GITORACLE_APP_ID }}
          APP_KEY: ${{ secrets.GITORACLE_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          KEY="$RUNNER_TEMP/github-app.pem"
          printf '%s\n' "$APP_KEY" > "$RUNNER_TEMP/github-app.original.pem"
          openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/github-app.original.pem" -out "$KEY"
          rm -f "$RUNNER_TEMP/github-app.original.pem"
          {
            echo "GITHUB_APP_ID=$APP_ID"
            echo "GITHUB_INSTALLATION_ID=$INSTALLATION_ID"
            echo "GITHUB_PRIVATE_KEY_PATH=$KEY"
          } > java-backend/github-bot/.env

      # Only what the pipeline needs — prometheus/grafana/langfuse/kafka-ui are
      # observability and would just eat runner memory.
      - name: Start infrastructure
        run: |
          docker compose -f docker-compose.infra.yml up -d --wait postgres neo4j redis qdrant kafka
          docker compose -f docker-compose.infra.yml up --no-deps --exit-code-from neo4j-init neo4j-init
          docker compose -f docker-compose.infra.yml up --no-deps --exit-code-from kafka-init kafka-init

      - name: Build and start services
        env:
          SKIP_DASHBOARD: '1'
        run: ./start_local.sh

      # Readiness by log line, not by curling ports (see CLAUDE.md).
      - name: Wait for services
        run: |
          deadline=$((SECONDS + 300))
          for svc in api-gateway error-ingestor orchestrator test-runner github-bot git-forensics; do
            until grep -q "Started .*Application" "java-backend/$svc.log" 2>/dev/null; do
              if [ $SECONDS -gt $deadline ]; then
                echo "::error::$svc did not start within 5 minutes"; tail -50 "java-backend/$svc.log"; exit 1
              fi
              sleep 3
            done
            echo "✅ $svc"
          done
          for agent in fixer planner investigator reviewer prompt_registry guardrails commit_analyst; do
            until grep -q "Uvicorn running" "ai_core/$agent.log" 2>/dev/null; do
              if [ $SECONDS -gt $deadline ]; then
                echo "::error::$agent did not start within 5 minutes"; tail -50 "ai_core/$agent.log"; exit 1
              fi
              sleep 3
            done
            echo "✅ $agent"
          done

      # Previous runs leave open PRs behind (their branches point at a history
      # this run is about to force-push away), so close them first.
      - name: Close stale fixture PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          api="https://api.github.com/repos/$EVAL_FIXTURE_REPO"
          for n in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/pulls?state=open&per_page=100" \
                     | python -c 'import json,sys; print(" ".join(str(p["number"]) for p in json.load(sys.stdin)))'); do
            curl -fsS -X PATCH -H "Authorization: Bearer $GH_TOKEN" "$api/pulls/$n" -d '{"state":"closed"}' >/dev/null
            echo "closed #$n"
          done

      - name: Build and publish golden repo
        env:
          EVAL_FIXTURE_PUSH_URL: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ vars.EVAL_FIXTURE_REPO }}.git
        run: python eval/setup_test_repo.py

      - name: Run evals
        env:
          EVAL_REPO_URL: https://github.com/${{ vars.EVAL_FIXTURE_REPO }}
        run: python eval/run_evals.py --output eval_report.json

      - name: Check regression baseline
        run: python eval/check_regression.py --report eval_report.json --min-score "$MIN_SCORE"

      - name: Summary
        if: always()
        run: |
          if [ -f eval_report.json ]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("eval_report.json"))
          print("## Golden dataset eval\n")
          print(f"| metric | value |\n|---|---|")
          print(f"| patch accuracy (stored) | {r['patch_accuracy']:.0%} |")
          print(f"| avg patch score | {r['avg_patch_score']:.0%} |")
          print(f"| cause accuracy (not stored; see run_evals.py) | {r['cause_accuracy']:.0%} |")
          print(f"| avg latency | {r['avg_latency_ms']} ms |")
          print(f"| incomplete / ungraded | {r['cases_incomplete']} / {r['cases_ungraded']} |\n")
          print("| case | status | score |\n|---|---|---|")
          for c in r["cases"]:
              print(f"| {c['case_id']} | {c['status']} | {c['patch_score']:.0%} |")
          EOF
          else
            echo "No eval report was produced — see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-and-logs
          path: |
            eval_report.json
            java-backend/*.log
            ai_core/*.log
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          ./stop_local.sh || true
          docker compose -f docker-compose.infra.yml down -v || true
