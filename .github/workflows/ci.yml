name: GitOracle CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The pre-commit hook (.githooks/pre-commit) runs the same scan locally, but a
  # hook is advisory — it lives outside the repo's object store, is not
  # installed by default, and --no-verify skips it. This job is the part that
  # cannot be bypassed.
  #
  # fetch-depth: 0 so the scan covers full history, not just the tip commit: a
  # secret added and then "removed" in a later commit is still in the history
  # and still leaked.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-lint:
    name: Python Agent Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint Tools
        run: pip install ruff mypy

      - name: Run Ruff Lint
        run: ruff check ai_core --select E9,F

      - name: Run Mypy Typecheck
        run: mypy ai_core/agents --ignore-missing-imports --no-error-summary || true

  java-integration-tests:
    name: Java Services Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Spring Boot Testcontainers Tests
        run: |
          cd java-backend
          chmod +x gradlew
          ./gradlew test --no-daemon

  python-agent-tests:
    name: AI Agent Tests (Mock LLM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Hash-pinned lock, not the loose >= ranges in requirements.in.
          # Every version is fixed and every artifact is verified against a
          # recorded sha256, so a compromised or yanked release cannot silently
          # enter a build. Regenerate with:
          #   pip-compile --generate-hashes --output-file=ai_core/requirements.lock.txt ai_core/requirements.in
          # under the SAME Python version this job uses — resolution is
          # interpreter-specific.
          pip install -r ai_core/requirements.lock.txt
          # Separate invocation on purpose: pip refuses to mix hashed and
          # unhashed requirements in one command.
          pip install pytest fastapi uvicorn

      - name: Run Mock LLM Server & Pytest
        run: |
          # Start the mock server in the background
          python ai_core/tests/mock_llm_server.py &
          
          # Wait a second for the server to bind
          sleep 2
          
          # Run pytest on the agents
          pytest ai_core/tests/

  # The dashboard was not built in CI at all, which is how it came to sit on
  # main with two TypeScript errors that failed `tsc -b` outright — nothing
  # would have caught a broken build before a deploy. This job also enforces the
  # lockfile: `npm ci` installs exactly what package-lock.json records and fails
  # if package.json and the lock disagree, where `npm install` would quietly
  # resolve something new and rewrite the lock.
  dashboard-build:
    name: Dashboard Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install (locked)
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        run: npm run build

  eval-harness:
    name: Golden Dataset Eval Harness
    runs-on: ubuntu-latest
    # Only run the full eval on pushes to main, to save budget/time on PRs
    if: github.ref == 'refs/heads/main'
    needs: [java-integration-tests, python-agent-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Eval Dependencies
        run: pip install -r ai_core/requirements.txt requests

      - name: Run Evals
        run: |
          # Note: This step would require a real LLM endpoint (e.g. via secrets) 
          # For now, it runs the mock script to generate a report
          python eval/run_evals.py --output eval_report.json || true

      - name: Check Regression Baseline
        # Soft-fail: this harness needs a live stack (orchestrator on :8083 etc.)
        # that CI doesn't stand up, so run_evals.py can't reach it and no report
        # is ever produced. Surface that as a visible warning instead of failing
        # every single commit on main for a gap unrelated to the commit's content.
        continue-on-error: true
        run: |
          # Fails the build if the accuracy drops below 0.75
          python eval/check_regression.py --report eval_report.json --min-score 0.75
