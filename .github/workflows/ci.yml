name: GitOracle CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

# A new push to the same PR/branch makes the previous run's result irrelevant —
# cancel it instead of letting both burn runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pre-commit hook (.githooks/pre-commit) runs the same scan locally, but a
  # hook is advisory — it lives outside the repo's object store, is not
  # installed by default, and --no-verify skips it. This job is the part that
  # cannot be bypassed.
  #
  # fetch-depth: 0 so the scan covers full history, not just the tip commit: a
  # secret added and then "removed" in a later commit is still in the history
  # and still leaked.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-lint:
    name: Python Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_core/requirements.txt

      # mypy needs the agents' real dependencies installed to resolve their
      # types (redis, asyncpg, gitpython, ...) — without them every import is
      # Any and the check proves nothing.
      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_core/requirements.txt ruff==0.8.6 mypy==1.13.0

      - name: Run Ruff Lint
        run: ruff check ai_core cli/gitOracle eval --select E9,F

      # Blocking. This was `|| true`, so it could never fail a build; the 17
      # errors it was hiding have been fixed.
      - name: Run Mypy Typecheck
        run: mypy ai_core/agents --ignore-missing-imports

  python-agent-tests:
    name: AI Agent Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_core/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_core/requirements.txt pytest==8.3.4

      # No mock LLM server: no test in ai_core/tests/ calls an LLM, so the
      # `mock_llm_server.py & sleep 2` that used to run here was dead weight.
      - name: Run Pytest
        run: pytest ai_core/tests/ --junitxml=pytest-report.xml

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  java-tests:
    name: Java Services Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --no-daemon matches gradle.properties, which disables the daemon on
      # purpose (see CLAUDE.md) — don't "optimise" it away here.
      - name: Run Tests (unit + Testcontainers)
        working-directory: java-backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            java-backend/**/build/reports/tests/
            java-backend/**/build/test-results/

  # The dashboard was not built in CI at all, which is how it came to sit on
  # main with TypeScript errors that failed `tsc -b` outright. `npm ci` also
  # enforces the lockfile: it installs exactly what package-lock.json records
  # and fails if package.json and the lock disagree.
  dashboard-build:
    name: Dashboard Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install (locked)
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        run: npm run build

  cli-check:
    name: CLI Install Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI
        run: pip install ./cli

      - name: Run --help
        run: gitOracle --help

  # The whole pipeline, for real, with only the LLM faked
  # (ai_core/tests/mock_llm_server.py): gateway → orchestrator → investigator →
  # planner → fixer → guardrails → test-runner's Maven run in Docker. Unit tests
  # can't see the class of bug that broke the first CI eval (an agent's Kafka
  # consumer dying on lz4-compressed messages); this does, on the PR that
  # introduces it, in ~10 minutes and without LLM tokens.
  #
  # It clones the public fixture repo read-only (no secrets), so it needs
  # vars.EVAL_FIXTURE_REPO — unavailable to fork PRs, which skip it — and the
  # case/npe branch, which the Golden Dataset Eval publishes on its first run.
  pipeline-e2e:
    name: Pipeline End-to-End (mock LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      EVAL_FIXTURE_REPO: ${{ vars.EVAL_FIXTURE_REPO }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check the fixture branch exists
        run: |
          if [ -z "$EVAL_FIXTURE_REPO" ]; then
            echo "::error::vars.EVAL_FIXTURE_REPO is not set (see the header of .github/workflows/eval.yml)"; exit 1
          fi
          if ! git ls-remote --exit-code --heads "https://github.com/$EVAL_FIXTURE_REPO" case/npe >/dev/null; then
            echo "::error::$EVAL_FIXTURE_REPO has no case/npe branch yet — run the Golden Dataset Eval once to publish the fixture branches."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_core/requirements.txt

      - name: Install Python agent dependencies
        run: |
          python -m venv ai_core/.venv
          ai_core/.venv/bin/pip install --upgrade pip
          ai_core/.venv/bin/pip install -r ai_core/requirements.txt
          pip install requests

      - name: Write .env (mock LLM)
        env:
          LLM_URL: http://127.0.0.1:18089/v1/chat/completions
          LLM_KEY: mock
          LLM_MODEL: mock
        run: scripts/ci/write_env.sh

      - name: Start the mock LLM
        run: |
          nohup ai_core/.venv/bin/python ai_core/tests/mock_llm_server.py > mock_llm.log 2>&1 &
          for i in $(seq 1 30); do grep -q "Uvicorn running" mock_llm.log && break; sleep 1; done
          grep -q "Uvicorn running" mock_llm.log || { cat mock_llm.log; exit 1; }

      - name: Start the stack
        run: scripts/ci/start_stack.sh

      - name: Run case1 end to end
        run: python scripts/ci/e2e_check.py --repo-url "https://github.com/$EVAL_FIXTURE_REPO" --branch case/npe

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-e2e-logs
          path: |
            java-backend/*.log
            ai_core/*.log
            supervisor.log
            mock_llm.log
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          ./stop_local.sh || true
          docker compose -f docker-compose.infra.yml down -v || true

# The golden-dataset eval needs a real LLM and costs tokens, so it lives in
# eval.yml (manual + nightly) rather than running on every PR.
