# Builds every GitOracle image and, on main or a v* tag, pushes it to GHCR:
#   ghcr.io/<owner>/gitoracle-<name>:<sha>, :main / :<tag>
# Pull requests only build, so a broken Dockerfile fails before merge.
name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'java-backend/**'
      - 'ai_core/**'
      - 'dashboard/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway,    context: java-backend, service: api-gateway }
          - { name: error-ingestor, context: java-backend, service: error-ingestor }
          - { name: git-forensics,  context: java-backend, service: git-forensics }
          - { name: orchestrator,   context: java-backend, service: orchestrator }
          - { name: test-runner,    context: java-backend, service: test-runner }
          - { name: github-bot,     context: java-backend, service: github-bot }
          - { name: agents,         context: ai_core }
          - { name: dashboard,      context: dashboard }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gitoracle-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.service && format('SERVICE={0}', matrix.service) || '' }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
