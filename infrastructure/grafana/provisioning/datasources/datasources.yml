apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      # No exemplarTraceIdDestinations: it linked to a "tempo" datasource that
      # was never provisioned (there is no Tempo in this stack).

  - name: PostgreSQL
    type: postgres
    uid: postgres
    url: postgres:5432
    user: ${GF_DATASOURCE_PG_USER}
    secureJsonData:
      password: ${GF_DATASOURCE_PG_PASSWORD}
    jsonData:
      # Was hardcoded to gitOracle; follows POSTGRES_DB like the postgres container.
      database: ${GF_DATASOURCE_PG_DATABASE}
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
