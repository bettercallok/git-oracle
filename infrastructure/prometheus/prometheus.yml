global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'gitOracle'
    environment: 'development'

rule_files:
  - /etc/prometheus/rules/*.yml

# Every GitOracle service runs on the host (start_local.sh) bound to
# 127.0.0.1 and is reached as host.docker.internal. That works on Docker
# Desktop (macOS/Windows), which forwards to the host's loopback. On Docker
# Engine for Linux, host.docker.internal is the bridge gateway and loopback-only
# services are unreachable from it: start the services with
# SERVER_BIND_HOST=0.0.0.0 / BIND_HOST=0.0.0.0 behind a host firewall, or run
# Prometheus with network_mode: host and these targets as localhost:<port>.

scrape_configs:

  # ─── Spring Boot Services (via Actuator /actuator/prometheus) ─
  # /actuator is exempt from each service's X-Internal-Token check.
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api-gateway'
          layer: 'java-service'

  - job_name: 'error-ingestor'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'error-ingestor'
          layer: 'java-service'

  - job_name: 'git-forensics'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'git-forensics'
          layer: 'java-service'

  - job_name: 'orchestrator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'orchestrator'
          layer: 'java-service'

  - job_name: 'test-runner'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          service: 'test-runner'
          layer: 'java-service'

  - job_name: 'github-bot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          service: 'github-bot'
          layer: 'java-service'

  # ─── Python AI Agents (via /metrics endpoint) ─────────────────
  # Served by every agent through shared/health.add_health_route →
  # shared/metrics.py, exempt from X-Internal-Token like /health.
  - job_name: 'investigator-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9001']
        labels:
          service: 'investigator'
          layer: 'ai-agent'

  - job_name: 'fixer-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9002']
        labels:
          service: 'fixer'
          layer: 'ai-agent'

  - job_name: 'reviewer-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9003']
        labels:
          service: 'reviewer'
          layer: 'ai-agent'

  # 9004 is commit_analyst; the planner binds 9007 (planner/main.py). This job
  # was labelled planner while scraping commit_analyst's port.
  - job_name: 'commit-analyst-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9004']
        labels:
          service: 'commit-analyst'
          layer: 'ai-agent'

  - job_name: 'planner-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9007']
        labels:
          service: 'planner'
          layer: 'ai-agent'

  - job_name: 'prompt-registry'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9005']
        labels:
          service: 'prompt-registry'
          layer: 'ai-infra'

  - job_name: 'guardrails'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9006']
        labels:
          service: 'guardrails'
          layer: 'ai-infra'

  # ─── Infrastructure Services ──────────────────────────────────
  # Was kafka:9101 — nothing listened there (no JMX exporter on the broker).
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'
          layer: 'infrastructure'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          layer: 'infrastructure'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          layer: 'infrastructure'

  # No neo4j job: its Prometheus endpoint (:2004) is a Neo4j Enterprise
  # feature, and this stack runs Community Edition, so the target could never
  # come up. git-forensics' own metrics cover the queries GitOracle makes.

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          layer: 'observability'
