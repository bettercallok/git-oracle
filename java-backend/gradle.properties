# Memory-safety defaults for running the full 7-module backend on 8GB machines.
# Without these, each `./gradlew` invocation can spin up its own persistent
# daemon (they idle for hours) and each daemon can claim a large default heap —
# on repeated restarts this silently accumulates until the host runs out of RAM.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
