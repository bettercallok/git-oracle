spring:
  application:
    name: git-forensics
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7688}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: git-forensics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Was "*" — see orchestrator's application.yml for why. This service's
        # one listener (ForensicsOrchestrator.handleErrorIngested) deserializes
        # ErrorIngestedEvent only.
        spring.json.trusted.packages: java.util,ai.gitoracle.core.kafka.event

server:
  port: 8082
  address: ${SERVER_BIND_HOST:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: WARN
    ai.gitoracle: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
  file:
    name: git-forensics.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
      total-size-cap: 200MB
      clean-history-on-start: false
