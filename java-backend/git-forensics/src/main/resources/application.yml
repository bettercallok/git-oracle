spring:
  application:
    name: git-forensics
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7688}
    authentication:
      username: ${NEO4J_USER:neo4j}
      # No default. This used to fall back to the literal "password" — which is
      # not merely a weak default but Neo4j's own well-known one, so an
      # unconfigured deployment did not fail, it quietly tried the exact
      # credential an attacker guesses first. The other three services already
      # declare ${POSTGRES_PASSWORD} with no fallback; this was the only
      # outlier. Spring now fails to start with a clear message when
      # NEO4J_PASSWORD is unset, which is the correct outcome for a missing
      # credential.
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: git-forensics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Was "*" — see orchestrator's application.yml for why. This service's
        # one listener (ForensicsOrchestrator.handleErrorIngested) deserializes
        # ErrorIngestedEvent only.
        spring.json.trusted.packages: java.util,ai.gitoracle.core.kafka.event

# Request body size cap (L3). Nothing bounded these, so Tomcat's 2GB default
# applied: one request could make a service buffer gigabytes and be OOM-killed,
# and these JVMs run with deliberately small heaps (start_local.sh caps them at
# 224-320MB). Sized for only small risk-query bodies.
# Headers are capped too — they are buffered before any application code runs,
# so a large header set otherwise bypasses every body limit.
server:
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
  max-http-request-header-size: 16KB
  port: 8082
  address: ${SERVER_BIND_HOST:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: WARN
    ai.gitoracle: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
  file:
    name: git-forensics.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
      total-size-cap: 200MB
      clean-history-on-start: false
