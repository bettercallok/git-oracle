# CORS was wide open (allowed-origins: "*") on every controller — restrict to the
# dashboard's own origin by default; override via GITORACLE_ALLOWED_ORIGINS for other setups.
gitoracle:
  allowed-origins: ${GITORACLE_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:gitOracle}
    username: ${POSTGRES_USER:gitOracle}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    # Off by default; enable per-environment with GITORACLE_SHOW_SQL=true.
    # This was hardcoded true, so every production log carried every statement
    # this service ran — including the parameter-bearing SQL for tenant-scoped
    # reads. That is a slow leak of customer data into a file with far weaker
    # access control than the database it came from, it makes the log useless
    # for anything else at volume, and it is a measurable throughput cost on a
    # hot path. The other two services already had show-sql: false.
    show-sql: ${GITORACLE_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${GITORACLE_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_HOST:127.0.0.1}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: none
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Was "*" — trusted-all-packages on an unauthenticated PLAINTEXT
        # broker (see C7) is a polymorphic-deserialization gadget path for
        # anyone who can write to a topic this service consumes. Listeners
        # here deserialize into either java.util.Map/HashMap (the Python
        # producer's __TypeId__) or git-oracle-core's own typed events
        # (e.g. ErrorIngestedEvent) — nothing else needs to be trusted.
        spring.json.trusted.packages: java.util,ai.gitoracle.core.kafka.event

server:
  port: 8083
  # Loopback by default — this service used to bind 0.0.0.0 (network-reachable)
  # with no auth of its own. Override only for a real container network where
  # the gateway reaches it by service name, not localhost.
  address: ${SERVER_BIND_HOST:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # This service does not use Neo4j (Neo4j data auto-config is excluded);
    # disable the actuator Neo4j probe so /actuator/health isn't falsely DOWN.
    neo4j:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: WARN
    ai.gitoracle: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
  file:
    name: orchestrator.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
      total-size-cap: 200MB
      clean-history-on-start: false
