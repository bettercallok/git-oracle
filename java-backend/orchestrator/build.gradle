plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':git-oracle-core')
    implementation 'org.kohsuke:github-api:1.330'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Bean Validation. Every request body in this module was a raw
    // Map<String,Object> read with getOrDefault, so a missing field became a
    // null or a silent default and a wrong type became a ClassCastException
    // surfaced to the caller as a 500. See ai.gitoracle.orchestrator.dto.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
