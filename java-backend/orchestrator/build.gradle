plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':git-oracle-core')
    implementation 'org.kohsuke:github-api:1.318'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.9.0.202403050737-r'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Bean Validation. Every request body in this module was a raw
    // Map<String,Object> read with getOrDefault, so a missing field became a
    // null or a silent default and a wrong type became a ClassCastException
    // surfaced to the caller as a 500. See ai.gitoracle.orchestrator.dto.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // One instance at a time runs JobWatchdog and PrStatusReconciler, however
    // many orchestrators are up (ShedLockConfig).
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'
    // Owns the schema (db/migration); version from Spring Boot's BOM.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
