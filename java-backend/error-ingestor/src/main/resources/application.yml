# Bridges the existing GITHUB_APP_WEBHOOK_SECRET/SENTRY_WEBHOOK_SECRET env
# var names (already present in .env.example, previously read nowhere) to
# property names WebhookController binds via @Value — these don't follow the
# gitoracle.* env-var convention Spring's relaxed binding resolves
# automatically, so they need an explicit mapping here.
gitoracle:
  github-webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET:}
  sentry-webhook-secret: ${SENTRY_WEBHOOK_SECRET:}

spring:
  application:
    name: error-ingestor
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:gitOracle}
    username: ${POSTGRES_USER:gitOracle}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_HOST:127.0.0.1}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: none
    consumer:
      group-id: error-ingestor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Was "*" — see orchestrator's application.yml for why. error-ingestor
        # has no @KafkaListener today (it only produces), but Spring Boot
        # autoconfigures the consumer factory regardless, so this stays
        # narrowed rather than left wide for whenever one is added.
        spring.json.trusted.packages: java.util,ai.gitoracle.core.kafka.event

# Request body size cap (L3). Nothing bounded these, so Tomcat's 2GB default
# applied: one request could make a service buffer gigabytes and be OOM-killed,
# and these JVMs run with deliberately small heaps (start_local.sh caps them at
# 224-320MB). Sized for webhook payloads: GitHub's own delivery limit is 25MB, but this
    # service only needs the event JSON, and C6 buffers the whole body in
    # memory to verify its HMAC before parsing.
# Headers are capped too — they are buffered before any application code runs,
# so a large header set otherwise bypasses every body limit.
server:
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  max-http-request-header-size: 16KB
  port: 8081
  address: ${SERVER_BIND_HOST:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # This service does not use Neo4j; disable the actuator Neo4j probe
    # so /actuator/health isn't falsely DOWN.
    neo4j:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: WARN
    ai.gitoracle: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
  file:
    name: error-ingestor.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
      total-size-cap: 200MB
      clean-history-on-start: false
