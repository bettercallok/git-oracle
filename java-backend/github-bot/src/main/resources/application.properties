server.port=8085
# Loopback by default — this service used to bind 0.0.0.0 with no auth of its
# own. Override only for a real container network where the orchestrator
# reaches it by service name, not localhost.
server.address=${SERVER_BIND_HOST:127.0.0.1}
spring.application.name=github-bot

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=github-bot-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Was "*" — trusted-all-packages plus an unauthenticated PLAINTEXT broker
# (see C7) is a polymorphic-deserialization gadget path for anyone who can
# write to this topic. github-bot only ever consumes its own PrEvent type
# (com.gitoracle.githubbot.feedback.PrEvent) from "github-pr-events" —
# github-bot has no dependency on git-oracle-core.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gitoracle.githubbot

# ── Log rotation (prevent disk fill) ─────────────────────────────
logging.level.root=WARN
logging.level.com.gitoracle=INFO
logging.level.org.springframework.kafka=WARN
logging.file.name=github-bot.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.clean-history-on-start=false
