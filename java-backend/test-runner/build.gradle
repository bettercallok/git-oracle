plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.gitoracle'
version = '0.0.1-SNAPSHOT'
description = 'GitOracle Test Runner'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// /actuator/prometheus for the Prometheus scrape job of the same name. Without
	// these two the endpoint 404'd, so JavaServiceDown fired for this service forever.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'com.github.docker-java:docker-java:3.3.6'
	implementation 'com.github.docker-java:docker-java-transport-httpclient5:3.3.6'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
