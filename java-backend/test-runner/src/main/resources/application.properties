server.port=8084
spring.application.name=test-runner

# ── Sandbox fallback (security-sensitive; see RunNativeUnsafe) ───────
# Docker is the only sandbox this service has for running a cloned repo's own
# test suite. When Docker is unavailable, test execution is refused (503 at
# startup preflight, or a failed TestResult per job) rather than silently
# falling back to running the repo's own build command directly on the host.
#
# Set gitoracle.allow-unsafe-native-tests=true (env:
# GITORACLE_ALLOW_UNSAFE_NATIVE_TESTS) ONLY for local dev machines where
# Docker Desktop may not always be running, AND only alongside an explicit
# gitoracle.testrunner.trusted-repos allowlist (comma-separated repo URLs,
# e.g. https://github.com/bettercallok/git-oracle) — an empty allowlist means
# deny-all even with the flag set. NEVER enable this in an environment that
# clones untrusted or public repos: it executes that repo's own build
# scripts (npm lifecycle scripts, maven plugins, setup.py, build.rs) as this
# service's own user, unsandboxed.
gitoracle.allow-unsafe-native-tests=${GITORACLE_ALLOW_UNSAFE_NATIVE_TESTS:false}
gitoracle.testrunner.trusted-repos=${GITORACLE_TESTRUNNER_TRUSTED_REPOS:}

# ── Log rotation (prevent disk fill) ─────────────────────────────
logging.level.root=WARN
logging.level.com.gitoracle=INFO
logging.level.org.springframework.kafka=WARN
logging.file.name=test-runner.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.clean-history-on-start=false
