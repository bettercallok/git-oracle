spring:
  application:
    name: api-gateway

  # Request body cap (L3). This service is WebFlux/Netty, not Tomcat, so the
  # servlet knobs the other services use do not apply — the equivalent is the
  # codec's in-memory buffer limit, which bounds how much of a body Spring will
  # accumulate before handing it to a handler. Default is 256KB for codecs but
  # unbounded for the proxied body, and this is the ONLY externally reachable
  # service, so it is the one that most needs a ceiling.
  #
  # 2MB matches the downstream services' own caps: letting the gateway accept
  # more than the service behind it can process only moves the failure one hop
  # later and wastes the bandwidth twice.
  codec:
    max-in-memory-size: 2MB


  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:gitOracle}
    username: ${POSTGRES_USER:gitOracle}
    password: ${POSTGRES_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_HOST:127.0.0.1}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: api-gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Was "*" — see orchestrator's application.yml for why. api-gateway
        # has no @KafkaListener today, but Spring Boot autoconfigures the
        # consumer factory regardless, so this stays narrowed.
        spring.json.trusted.packages: java.util,ai.gitoracle.core.kafka.event
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${GITORACLE_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: error_ingestor_api
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/webhook/**
          filters:
            - PreserveHostHeader=true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
        - id: git_forensics_api
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/api/v1/risk
          filters:
            - PreserveHostHeader=true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
        - id: orchestrator_api
          uri: http://127.0.0.1:8083
          predicates:
            - Path=/api/v1/**
          filters:
            - PreserveHostHeader=true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # This service does not use Neo4j; disable the actuator Neo4j probe
    # so /actuator/health isn't falsely DOWN.
    neo4j:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: WARN
    ai.gitoracle: INFO
    org.springframework.kafka: WARN
    org.springframework.cloud.gateway: WARN
    org.hibernate.SQL: WARN
  file:
    name: api-gateway.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
      total-size-cap: 200MB
      clean-history-on-start: false
